<nav class="outline" aria-label="Table of contents" hidden></nav>
<script>
(() => {
  // Build an Obsidian Reader-style outline from the article headings.
  // Kramdown already assigns ids to headings, so we reuse them as scroll
  // targets (same source heading_anchors.html links to).
  const nav = document.querySelector('nav.outline');
  if (!nav) return;

  const headings = [...document.querySelectorAll('main article :is(h2, h3, h4)[id]')];
  if (headings.length < 2) return; // not worth an outline for a single section

  const items = headings.map((heading) => {
    const level = parseInt(heading.tagName[1], 10);
    const item = document.createElement('a');
    item.href = '#' + heading.id;
    item.className = 'outline-item outline-h' + level;
    item.dataset.depth = String(level - 2);
    item.dataset.headingId = heading.id;

    // Strip the injected anchor-link text, keep only the heading title.
    item.textContent = heading.firstChild && heading.firstChild.textContent
      ? heading.firstChild.textContent.trim()
      : heading.textContent.trim();

    nav.appendChild(item);
    return { heading, item };
  });

  nav.hidden = false;

  // Highlight the section currently nearest the top of the viewport,
  // mirroring Obsidian Reader: headings above it fade out, the active
  // one stays highlighted, and the outline auto-scrolls to keep it visible.
  const byId = new Map(items.map(({ heading, item }) => [heading.id, item]));
  let activeId = null;

  const setActive = (id) => {
    if (id === activeId) return;
    if (activeId) byId.get(activeId)?.classList.remove('active');
    activeId = id;

    let reachedActive = false;
    for (const { heading, item } of items) {
      item.classList.remove('active');
      if (heading.id === activeId) {
        item.classList.remove('faint');
        item.classList.add('active');
        reachedActive = true;
      } else {
        item.classList.toggle('faint', !reachedActive);
      }
    }
    byId.get(activeId)?.scrollIntoView({ block: 'nearest' });
  };

  const visible = new Set();
  const observer = new IntersectionObserver(
    (entries) => {
      for (const entry of entries) {
        if (entry.isIntersecting) visible.add(entry.target);
        else visible.delete(entry.target);
      }
      // Of the headings currently on screen, pick the topmost.
      if (visible.size > 0) {
        const top = [...visible].sort(
          (a, b) => a.getBoundingClientRect().top - b.getBoundingClientRect().top
        )[0];
        setActive(top.id);
      } else {
        // Between sections: fall back to the last heading scrolled past.
        let current = headings[0];
        for (const h of headings) {
          if (h.getBoundingClientRect().top < 100) current = h;
          else break;
        }
        setActive(current.id);
      }
    },
    { rootMargin: '0px 0px -70% 0px', threshold: 0 }
  );

  headings.forEach((h) => observer.observe(h));
})();
</script>
